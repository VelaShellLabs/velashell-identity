# VelaShell 统一认证服务(OIDC / OpenIddict + MongoDB)。
#
# 这份 compose **自带一个 MongoDB**,于是本仓库能独立跑起来 —— 拆分之前它依赖
# 插件市场的副本集,而一个信任根不该非得先起一整套业务系统才能开发。
#
# 生产上通常不用这里的 mongo:把 ConnectionStrings__Mongo 指向共享的副本集即可
# (库名仍是 velashell-identity)。
#
# 下游服务(velashell-markets / velashell-feeds)通过 extra_hosts + host-gateway
# 连到本服务对外暴露的端口。

services:
  mongo:
    image: mongo:8
    container_name: identity-mongo
    restart: unless-stopped
    # 开了鉴权的副本集必须有 keyFile —— 单节点也一样,没有它 mongod 直接拒绝启动
    # ("security.keyFile is required when authorization is enabled with replica sets")。
    # 就地生成一把并留在数据卷里:重启后仍是同一把,与数据同生共死。
    entrypoint:
      - bash
      - -c
      - |
        KEY=/data/db/replset.key
        if [ ! -s "$$KEY" ]; then
          head -c 756 /dev/urandom | base64 | tr -d '\n' > "$$KEY"
        fi
        chmod 400 "$$KEY"
        chown mongodb:mongodb "$$KEY"
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile "$$KEY"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:-identity}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-change-me-please}
    volumes:
      - identity-mongo-data:/data/db
    ports:
      - "${MONGO_PORT:-27020}:27017"
    healthcheck:
      # OpenIddict 的部分操作要事务,而事务要求副本集 —— 单节点副本集就够,
      # 但必须真的 initiate 过,否则驱动会一直处在 "Type: Unknown" 的状态。
      # 成员地址必须写 mongo:27017 而不是 localhost:27017 —— 驱动按 rs 配置里的地址
      # 重新建连,写 localhost 的话 identity 容器会去连它自己,表现为启动时卡死在连库。
      test: >
        mongosh --quiet
        -u ${MONGO_ROOT_USER:-identity} -p ${MONGO_ROOT_PASSWORD:-change-me-please}
        --authenticationDatabase admin
        --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # 密钥卷的属主。镜像由 .NET SDK 产出(没有 Dockerfile,也就没有 RUN/chown 那一步),
  # 而容器以非 root 的 app(uid 1654)运行;命名卷第一次挂载时 Docker 会把它建成 root 所有,
  # 于是签名密钥一条都写不进去。这里拿**同一个镜像**以 root 跑一次 chown 就退出 ——
  # 不额外引入 busybox 之类的镜像,部署到别处时也不必多传一个 tar。
  identity-keys-init:
    image: ${IDENTITY_IMAGE:-velashell/identity:latest}
    container_name: velashell-identity-keys-init
    user: "0:0"
    entrypoint: ["sh", "-c", "chown -R 1654:1654 /keys"]
    volumes:
      - identity-keys:/keys
    restart: "no"

  identity:
    # 镜像不再由 compose 构建:`dotnet publish -t:PublishContainer` 产出它,
    # 见 build/Publish-Image.ps1。没先发布过的话这里会去 Docker Hub 拉一个不存在的镜像。
    #
    # 默认值是**本机发布出来的那个名字**,开发机上 `docker compose up -d` 直接命中。
    # 从 Harbor 拉着跑的机器在 .env 里写:
    #   IDENTITY_IMAGE=harbor.easilynet.top/velashell/identity:latest
    # 两处 image 都用同一个变量 —— keys-init 必须与 identity 是同一个镜像(见上面的说明)。
    image: ${IDENTITY_IMAGE:-velashell/identity:latest}
    container_name: velashell-identity
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      identity-keys-init:
        condition: service_completed_successfully
    environment:
      - TZ=Asia/Chongqing
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_HTTP_PORTS=8080
      # ⚠️ 库名 velashell-identity 是账号所在地,**改了等于所有账号消失**。
      - ConnectionStrings__Mongo=${MONGO_CONNECTION:-mongodb://${MONGO_ROOT_USER:-identity}:${MONGO_ROOT_PASSWORD:-change-me-please}@mongo:27017/velashell-identity?authSource=admin&replicaSet=rs0}
      # ⚠️ issuer 必须是**浏览器能打开**的地址,而且**改了所有已发出的令牌立刻失效**,
      # 下游每个服务的 Auth__Issuer 都要跟着改。
      - Identity__Issuer=${IDENTITY_ISSUER:-http://localhost:7020}
      - Identity__RequireHttps=${IDENTITY_REQUIRE_HTTPS:-false}
      - Identity__KeyDirectory=/app/keys
      # ---- 下游客户端与 API 资源 ----
      # 客户端与 scope 不需要手工写库:本服务每次启动都按配置覆盖进 MongoDB,
      # 于是"改配置 → 重启"是唯一的管理方式,不会出现配置与库不一致的第三种状态。
      # 新接一个服务 = 在这里加一组 Clients__N__* 与 Resources__N__*。
      # 配置节是 Scopes(每项内部才有 Resources,那是令牌 aud)。写成 Identity__Resources__ 不生效,
      # 症状是下游一发起登录就被回 invalid_scope。
      - Identity__Scopes__0__Name=velashell-market
      - Identity__Scopes__0__DisplayName=VelaShell 插件市场
      - Identity__Scopes__0__Resources__0=velashell-market
      - Identity__Scopes__1__Name=velashell-feeds
      - Identity__Scopes__1__DisplayName=VelaShell 资讯服务
      - Identity__Scopes__1__Resources__0=velashell-feeds
      # 插件市场前端(公开客户端,浏览器里没地方藏密钥,靠 PKCE)
      - Identity__Clients__0__ClientId=velashell-market-web
      - Identity__Clients__0__DisplayName=VelaShell 插件市场
      - Identity__Clients__0__RedirectUris__0=${MARKET_WEB_ORIGIN:-http://localhost:8000}/callback
      - Identity__Clients__0__PostLogoutRedirectUris__0=${MARKET_WEB_ORIGIN:-http://localhost:8000}
      - Identity__Clients__0__Scopes__0=velashell-market
      # 资讯服务管理台(有后端的机密客户端)
      - Identity__Clients__1__ClientId=velashell-feeds-admin
      - Identity__Clients__1__DisplayName=VelaShell 资讯服务
      - Identity__Clients__1__ClientSecret=${FEEDS_CLIENT_SECRET:-}
      - Identity__Clients__1__RedirectUris__0=${FEEDS_ORIGIN:-http://localhost:7030}/signin-oidc
      - Identity__Clients__1__PostLogoutRedirectUris__0=${FEEDS_ORIGIN:-http://localhost:7030}/
      - Identity__Clients__1__Scopes__0=velashell-feeds
      # ---- 账号 ----
      - Accounts__AllowSelfRegistration=${ALLOW_SELF_REGISTRATION:-true}
      # 首个账号:只在账号集合为空时创建。留空则去 /account/register 自助注册。
      # 三项要么都填要么都不填 —— 邮箱是必填项,漏了这一条账号建不出来,
      # 启动日志里会留下一句"首个账号 xxx 没建成:请填写邮箱。"。
      - Accounts__Bootstrap__UserName=${BOOTSTRAP_USER:-}
      - Accounts__Bootstrap__Password=${BOOTSTRAP_PASSWORD:-}
      - Accounts__Bootstrap__Email=${BOOTSTRAP_EMAIL:-}
      # ---- 发信(找回口令)----
      # MAIL_HOST 留空 = 本部署不发信,找回口令页会直说"没开通,请联系管理员",
      # 而不是假装发出了一封信让人干等。
      # 端口:587 配 MAIL_IMPLICIT_TLS=false(STARTTLS),465 配 true(隐式 TLS)。
      # MAIL_PASSWORD 在多数邮箱服务商那里要填的是「授权码」,不是登录口令。
      - Mail__Host=${MAIL_HOST:-}
      - Mail__Port=${MAIL_PORT:-587}
      - Mail__UseImplicitTls=${MAIL_IMPLICIT_TLS:-false}
      - Mail__UserName=${MAIL_USER:-}
      - Mail__Password=${MAIL_PASSWORD:-}
      - Mail__FromAddress=${MAIL_FROM:-}
      - Mail__FromName=${MAIL_FROM_NAME:-VelaShell 统一认证}
    volumes:
      # ⚠️ 签名与加密密钥。**丢了等于换签发者**:所有已发出的令牌一起失效,所有人被登出。
      # 这个卷要进备份清单。
      - identity-keys:/app/keys
    ports:
      - "${IDENTITY_PORT:-7020}:8080"

volumes:
  identity-mongo-data:
  identity-keys:
